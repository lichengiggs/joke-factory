name: rebuild joke index
on:
  push:
    branches: [main]
concurrency:
  group: rebuild-joke-index
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild joke.md
        run: |
          set -eu
          git config user.name "joke-bot"
          git config user.email "joke-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 build.py
            git add joke.md jokes
            if git diff --cached --quiet; then
              echo "joke.md 已是最新"
              exit 0
            fi
            git commit -m "rebuild joke.md"
            if git push origin HEAD:main; then
              echo "joke.md 已重建"
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done
          echo "连续 push 失败" >&2
          exit 1
